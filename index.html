<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Level 7 Pictures</title>
<meta name="description" content="Level 7 Pictures — by Said El Marouk. Site under construction." />
<link rel="icon" type="image/png" href="l7-mark-light.png" />
<style>
  :root {
    --blue: #2f9de4;
    --blue-glow: rgba(47, 157, 228, 0.55);
    --bg: #05070c;
    --text: #e8edf4;
    --muted: #7c8798;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient glow backdrop */
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 90vmax;
    height: 90vmax;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center,
      rgba(47, 157, 228, 0.16) 0%,
      rgba(47, 157, 228, 0.06) 30%,
      transparent 62%);
    pointer-events: none;
    animation: breathe 8s ease-in-out infinite;
  }

  /* Fine grid texture */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  .logo {
    width: clamp(180px, 42vw, 360px);
    height: auto;
    filter: drop-shadow(0 0 34px var(--blue-glow));
    animation: float 6s ease-in-out infinite;
  }

  .byline {
    margin-top: 2.2rem;
    font-size: clamp(0.95rem, 2.4vw, 1.25rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text);
    font-weight: 300;
  }

  .byline span {
    color: var(--blue);
    font-weight: 500;
  }

  .divider {
    width: 54px;
    height: 1px;
    margin: 1.8rem 0 1.6rem;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity: 0.8;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-size: clamp(0.7rem, 2vw, 0.85rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 12px var(--blue);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.06); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="stage">
    <img class="logo" src="l7-mark-light.png" alt="Level 7 Pictures logo" />
    <p class="byline">by <span>Said El Marouk</span></p>
    <div class="divider"></div>
    <p class="status"><span class="dot"></span>Under Construction</p>
  </main>
</body>
</html>
